name: CI
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet restore PulseGrid.sln --configfile NuGet.Config
      - run: dotnet build PulseGrid.sln -c Release --no-restore
      - run: dotnet test PulseGrid.sln -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Capture a real failed xUnit run
        shell: pwsh
        run: ./eng/verify-sample.ps1
      - run: dotnet pack PulseGrid.sln -c Release --no-build --output artifacts/packages
