version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "19:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "19:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: ci
